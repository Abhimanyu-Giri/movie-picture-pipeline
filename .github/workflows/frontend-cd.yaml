name: Frontend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_FRONTEND }}
  K8S_NAMESPACE: default

jobs:

  lint:
    name: Frontend Lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint


  test:
    name: Frontend Tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watchAll=false --runInBand


  build:
    name: Build and Push Frontend Image
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: movie-picture-frontend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Configure EKS and a matching kubectl version
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          CLUSTER_VERSION=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query 'cluster.version' --output text)
          KUBECTL_VERSION=$(curl --fail --silent --show-error "https://dl.k8s.io/release/stable-$CLUSTER_VERSION.txt")
          echo "KUBECTL_VERSION=$KUBECTL_VERSION" >> "$GITHUB_ENV"
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - name: Discover and verify the real backend LoadBalancer
        id: backend
        run: |
          set -euo pipefail
          BACKEND_URL=$(bash scripts/load-balancer-url.sh backend)
          python3 scripts/verify-runtime.py --backend "$BACKEND_URL" --output "$RUNNER_TEMP/backend-check"
          echo "url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "Building frontend for backend: $BACKEND_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and push commit-tagged image
        working-directory: starter/frontend
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          BACKEND_API_URL: ${{ steps.backend.outputs.url }}
        run: |
          set -euo pipefail
          test -n "$ECR_REPOSITORY"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --build-arg "REACT_APP_MOVIE_API_URL=$BACKEND_API_URL" --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
      - name: Save public frontend build configuration
        env:
          BACKEND_API_URL: ${{ steps.backend.outputs.url }}
        run: |
          mkdir -p build-config
          printf '%s\n' "$BACKEND_API_URL" > build-config/backend-url.txt
      - name: Upload frontend build configuration
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-config-${{ github.run_id }}
          path: build-config/backend-url.txt
          if-no-files-found: error
          overwrite: true

  deploy:
    name: Deploy Frontend and Verify AWS Runtime
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: movie-picture-frontend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Configure EKS and a matching kubectl version
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          CLUSTER_VERSION=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query 'cluster.version' --output text)
          KUBECTL_VERSION=$(curl --fail --silent --show-error "https://dl.k8s.io/release/stable-$CLUSTER_VERSION.txt")
          echo "KUBECTL_VERSION=$KUBECTL_VERSION" >> "$GITHUB_ENV"
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.4.2'
      - name: Apply the exact commit image
        working-directory: starter/frontend/k8s
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          kustomize edit set image "frontend=$IMAGE_URI"
          kustomize build . | kubectl apply -f -
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/frontend --timeout=300s
      - name: Download the configuration used for this frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-config-${{ github.run_id }}
          path: build-config
      - name: Verify public AWS endpoints and collect evidence
        env:
          EXPECTED_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          EXPECTED_BACKEND_URL=$(cat build-config/backend-url.txt)
          export EXPECTED_BACKEND_URL
          bash scripts/collect-runtime-evidence.sh frontend
      - name: Upload measured runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: frontend-aws-runtime-${{ github.sha }}-${{ github.run_attempt }}
          path: PROOF/Runtime/frontend/
          if-no-files-found: error

      # These final logging steps are intentionally kept in the workflow so a
      # reviewer can verify the live Kubernetes workload and pushed ECR image
      # directly from the GitHub Actions run.
      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=180s || true
          echo "----- Logging - kubectl get all ---- "
          kubectl get all
          echo "----- Logging - kubectl describe deploy ----- "
          kubectl describe deploy frontend

      - name: Verify Frontend ECR image
        run: |
          echo "----- Logging - Frontend ECR Image Details ----- "
          AWS_PAGER="" aws ecr describe-images --repository-name frontend --region us-east-1 --query 'sort_by(imageDetails,&imagePushedAt)[-1].{Tags:imageTags,Digest:imageDigest,PushedAt:imagePushedAt}' --output table
